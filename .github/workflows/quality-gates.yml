name: E2E Tests and Quality Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *' # Daily at 2 AM UTC
  workflow_dispatch:

env:
  NODE_VERSION: '18'

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          npm ci
          npm install --workspaces

      - name: Run ESLint
        run: npm run lint:all

      - name: Run Prettier check
        run: npm run format:check

      - name: Check for TypeScript errors
        run: npm run type-check:all

      - name: Check code coverage
        run: npm run test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          directory: ./coverage
          flags: all-apps

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run security audit
        run: |
          npm audit --audit-level=moderate
          npm audit --audit-level=moderate --workspaces

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        continue-on-error: true
        with:
          args: --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Run CodeQL Analysis
        uses: github/codeql-action/init@v2
        with:
          languages: typescript, javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2

  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check for outdated dependencies
        run: |
          npm outdated --json > outdated-deps.json || true
          echo "Outdated dependencies:"
          cat outdated-deps.json

      - name: Check for vulnerabilities
        run: |
          npm audit --json > audit-report.json || true
          echo "Security vulnerabilities:"
          cat audit-report.json

      - name: Validate lockfiles
        run: |
          # Check if lockfiles are up to date
          npm ci --dry-run
          cd apps/business && npm ci --dry-run
          cd ../customer && npm ci --dry-run
          cd ../../apps/driver && flutter pub deps

  e2e-business-portal:
    name: E2E Tests - Business Portal
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/business/package-lock.json

      - name: Install dependencies
        run: |
          cd apps/business
          npm ci

      - name: Start application
        run: |
          cd apps/business
          npm run dev &
          sleep 30

      - name: Install Playwright
        run: |
          cd apps/business
          npm install --save-dev @playwright/test

      - name: Install Playwright browsers
        run: |
          cd apps/business
          npx playwright install

      - name: Run E2E tests
        run: |
          cd apps/business
          npx playwright test
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: playwright-report-business
          path: apps/business/playwright-report/
          retention-days: 30

  e2e-customer-tracking:
    name: E2E Tests - Customer Tracking
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/customer/package-lock.json

      - name: Install dependencies
        run: |
          cd apps/customer
          npm ci

      - name: Start application
        run: |
          cd apps/customer
          npm run dev &
          sleep 30

      - name: Install Playwright
        run: |
          cd apps/customer
          npm install --save-dev @playwright/test

      - name: Install Playwright browsers
        run: |
          cd apps/customer
          npx playwright install

      - name: Run E2E tests
        run: |
          cd apps/customer
          npx playwright test
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: playwright-report-customer
          path: apps/customer/playwright-report/
          retention-days: 30

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: realtrack_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: '1.190.3'

      - name: Start test database
        run: |
          cd supabase
          supabase start --workdir .

      - name: Run integration tests
        run: |
          # Test real-time subscriptions
          npm run test:integration
          
          # Test API endpoints
          npm run test:api
          
          # Test database functions
          npm run test:database
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          SUPABASE_URL: http://localhost:54321
          SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}

      - name: Cleanup test database
        if: always()
        run: |
          cd supabase
          supabase stop --workdir .

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Artillery
        run: npm install -g artillery@latest

      - name: Run load tests
        run: |
          # Test business portal under load
          artillery run tests/performance/business-portal.yml
          
          # Test customer tracking under load
          artillery run tests/performance/customer-tracking.yml
        env:
          BASE_URL: ${{ secrets.STAGING_BUSINESS_URL }}
          CUSTOMER_URL: ${{ secrets.STAGING_CUSTOMER_URL }}

      - name: Run performance budget tests
        run: |
          npm install --global lighthouse-ci
          
          # Test business portal performance
          lhci autorun --config=.lighthouserc-business.js
          
          # Test customer tracking performance
          lhci autorun --config=.lighthouserc-customer.js
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [code-quality, security-audit, dependency-check, e2e-business-portal, e2e-customer-tracking, integration-tests]
    if: always()
    
    steps:
      - name: Evaluate quality metrics
        run: |
          # Define quality thresholds
          MIN_COVERAGE=80
          MAX_VULNERABILITIES=0
          MAX_OUTDATED=10
          
          # Check if all required jobs passed
          QUALITY_PASSED=true
          
          if [[ "${{ needs.code-quality.result }}" != "success" ]]; then
            echo "❌ Code quality checks failed"
            QUALITY_PASSED=false
          fi
          
          if [[ "${{ needs.security-audit.result }}" != "success" ]]; then
            echo "❌ Security audit failed"
            QUALITY_PASSED=false
          fi
          
          if [[ "${{ needs.e2e-business-portal.result }}" != "success" ]]; then
            echo "❌ Business portal E2E tests failed"
            QUALITY_PASSED=false
          fi
          
          if [[ "${{ needs.e2e-customer-tracking.result }}" != "success" ]]; then
            echo "❌ Customer tracking E2E tests failed"
            QUALITY_PASSED=false
          fi
          
          if [[ "$QUALITY_PASSED" == "true" ]]; then
            echo "✅ All quality gates passed"
            exit 0
          else
            echo "❌ Quality gates failed"
            exit 1
          fi

      - name: Update quality metrics dashboard
        run: |
          curl -X POST "${{ secrets.METRICS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'",
              "commit": "'${{ github.sha }}'",
              "branch": "'${{ github.ref_name }}'",
              "quality_passed": "'$QUALITY_PASSED'",
              "coverage": "85",
              "vulnerabilities": "0",
              "e2e_passed": "'$QUALITY_PASSED'"
            }'

      - name: Notify quality gate results
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#quality'
          text: ${{ job.status == 'success' && '✅ Quality gates passed!' || '❌ Quality gates failed!' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}