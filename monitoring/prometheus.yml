global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # System metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Database metrics
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Redis metrics
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']

  # RealTrack applications
  - job_name: 'business-portal'
    static_configs:
      - targets: ['business.realtrack.app:80']
    metrics_path: '/api/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s

  - job_name: 'customer-tracking'
    static_configs:
      - targets: ['track.realtrack.app:80']
    metrics_path: '/api/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s

  # Supabase metrics (if available)
  - job_name: 'supabase'
    static_configs:
      - targets: ['your-project.supabase.co:443']
    metrics_path: '/metrics'
    scheme: https
    scrape_interval: 60s
    scrape_timeout: 15s

  # Nginx metrics
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:80']
    metrics_path: '/nginx_status'
    scrape_interval: 30s

  # Custom RealTrack metrics
  - job_name: 'realtrack-custom'
    static_configs:
      - targets: ['business.realtrack.app:80', 'track.realtrack.app:80']
    metrics_path: '/api/internal/metrics'
    params:
      token: ['${MONITORING_TOKEN}']
    scrape_interval: 30s
    honor_labels: true